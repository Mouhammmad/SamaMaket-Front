<div class="app-shell">
  <header class="app-topbar">
    <a class="brand" routerLink="/accueil">SAMA MARKET</a>
    <a class="cart-pill" [class.pulse]="toastMessage" routerLink="/panier" routerLinkActive="active" aria-label="Voir mon panier">
      <span class="icon">🛒</span>
      <span class="label">Panier</span>
      <span class="count" *ngIf="cartCount > 0">{{ cartCount }}</span>
    </a>
  </header>

  <router-outlet></router-outlet>

  <div class="toast" *ngIf="toastMessage">{{ toastMessage }}</div>
</div>
