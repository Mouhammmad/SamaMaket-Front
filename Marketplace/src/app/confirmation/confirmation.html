<div class="confirmation-page">
  <div class="card">
    <div class="icon">✅</div>
    <h1>Commande confirmée</h1>
    <p>Votre commande a bien été enregistrée. Vous pouvez suivre son état depuis votre espace commandes.</p>
    <p *ngIf="commandeId">Numéro de commande : <strong>{{ commandeId }}</strong></p>
    <div class="actions">
      <a routerLink="/mes-commandes" class="btn primary">Voir mes commandes</a>
      <a routerLink="/produits" class="btn secondary">Continuer mes achats</a>
    </div>
  </div>
</div>
