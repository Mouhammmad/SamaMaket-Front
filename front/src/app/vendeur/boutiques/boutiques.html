<app-boutique-header
    [boutique]="boutique"
    [estSuivi]="estSuivi"
    [chargementSuivi]="chargementSuivi"
    (suivre)="toggleSuivi()"
    (contacter)="contacter()"
></app-boutique-header>

<app-boutique-navigation
    [onglet]="onglet"
    [boutique]="boutique"
    (changer)="changerOnglet($event)">
</app-boutique-navigation>

<section class="boutique-edition">
    <div class="edition-heading">
        <div>
            <span class="edition-kicker">Personnalisation</span>
            <h2>Identité visuelle</h2>
            <p>Modifiez le logo et la bannière affichés sur votre boutique.</p>
        </div>
        <img
            class="logo-preview"
            [src]="boutique?.logo || 'assets/images/boutique.png'"
            alt="Aperçu du logo de la boutique">
    </div>

    <form [formGroup]="boutiqueForm" (ngSubmit)="enregistrer()" class="edition-form">
        <label>
            Logo
            <input
                type="file"
                accept="image/*"
                (change)="onLogoSelected($event)">
        </label>

        <label>
            Bannière
            <input
                type="file"
                accept="image/*"
                (change)="onBanniereSelected($event)">
        </label>

        <button type="button" (click)="enregistrerImages()">Enregistrer les images</button>
    </form>
</section>

<div class="contenu">

    <div class="sidebar">

        <app-boutique-infos
            [boutique]="boutique">
        </app-boutique-infos>

        <app-boutique-note
            [boutique]="boutique">
        </app-boutique-note>

        <app-boutique-categories
            [boutique]="boutique">
        </app-boutique-categories>

    </div>

    <div class="main">

        <app-boutique-produits
            *ngIf="onglet==='produits'"
            [produits]="produits">
        </app-boutique-produits>

        <app-boutique-apropos
            *ngIf="onglet==='apropos'"
            [boutique]="boutique">
        </app-boutique-apropos>

        <app-boutique-avis
            *ngIf="onglet==='avis'"
            [avis]="avis">
        </app-boutique-avis>

        <app-boutique-promotions
            *ngIf="onglet==='promotions'"
            [promotions]="promotions">
        </app-boutique-promotions>

    </div>

</div>
