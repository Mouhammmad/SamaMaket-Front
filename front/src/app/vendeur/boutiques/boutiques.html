<div class="boutique-page">

    <app-boutique-header
        [boutique]="maBoutique"
        (logoSelected)="onLogoSelected($event)"
        (banniereSelected)="onBanniereSelected($event)">
    </app-boutique-header>

    <app-boutique-tabs
        (tabChanged)="changerOnglet($event)">
    </app-boutique-tabs>

    <div
        class="layout"
        *ngIf="ongletActif === 'produits'">

        <div class="left">

            <app-boutique-sidebar
                [boutique]="maBoutique">
            </app-boutique-sidebar>

        </div>

        <div class="right">

            <app-boutique-products
                [produits]="produits"
                [chargementProduits]="chargementProduits">
            </app-boutique-products>

        </div>

    </div>

    <div
        class="content-card"
        *ngIf="ongletActif === 'apropos'">

        <h3>À propos de la boutique</h3>

        <p>

            {{ maBoutique?.description || 'Aucune description disponible.' }}

        </p>

    </div>

    <div
        class="content-card"
        *ngIf="ongletActif === 'avis'">

        <h3>Avis clients</h3>

        <p>Les avis clients apparaîtront ici.</p>

    </div>

    <div
        class="content-card"
        *ngIf="ongletActif === 'promotions'">

        <h3>Promotions</h3>

        <p>Les promotions seront affichées ici.</p>

    </div>

</div>
