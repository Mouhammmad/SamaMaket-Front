<div class="settings-card">

  <!-- ======================================================
       EN-TÊTE
       ====================================================== -->

  <div class="card-header">

    <div>

      <h2>
        Informations de la boutique
      </h2>

      <p>
        Modifiez les informations principales de votre boutique.
      </p>

    </div>

  </div>


  <!-- ======================================================
       FORMULAIRE
       ====================================================== -->

  <form
    [formGroup]="formulaire"
    (ngSubmit)="enregistrer()"
    class="settings-form">


    <!-- ====================================================
         NOM
         ==================================================== -->

    <div class="form-group">

      <label for="nom">
        Nom de la boutique
        <span class="required">*</span>
      </label>

      <input
        id="nom"
        type="text"
        formControlName="nom"
        placeholder="Ex : Ma Boutique"
        [class.invalid]="nom?.invalid && nom?.touched">

      <div
        class="error"
        *ngIf="nom?.invalid && nom?.touched">

        <span *ngIf="nom?.errors?.['required']">
          Le nom de la boutique est obligatoire.
        </span>

        <span *ngIf="nom?.errors?.['maxlength']">
          Le nom ne doit pas dépasser 100 caractères.
        </span>

      </div>

    </div>


    <!-- ====================================================
         DESCRIPTION
         ==================================================== -->

    <div class="form-group">

      <label for="description">
        Description
      </label>

      <textarea
        id="description"
        formControlName="description"
        rows="5"
        placeholder="Présentez votre boutique à vos clients...">
      </textarea>

      <div class="help-text">
        Décrivez brièvement votre activité et vos produits.
      </div>

    </div>


    <!-- ====================================================
         VILLE
         ==================================================== -->

    <div class="form-group">

      <label for="ville">
        Ville
      </label>

      <input
        id="ville"
        type="text"
        formControlName="ville"
        placeholder="Ex : Dakar">

    </div>


    <!-- ====================================================
         ACTIONS
         ==================================================== -->

    <div class="form-actions">

      <button
        type="submit"
        class="save-button"
        [disabled]="enregistrement">

        <span
          class="button-spinner"
          *ngIf="enregistrement">
        </span>

        <span *ngIf="!enregistrement">
          Enregistrer
        </span>

        <span *ngIf="enregistrement">
          Enregistrement...
        </span>

      </button>

    </div>

  </form>

</div>
