<div class="overlay">
  <div class="preview-card">
    <button type="button" class="close" (click)="fermer.emit()">✕</button>
    <h2 class="modal-title">{{ produit ? 'Modifier le produit' : 'Nouveau produit' }}</h2>

    <form [formGroup]="produitForm" (ngSubmit)="enregistrer()" class="modal-form">

  <div class="grid">

    <div class="field">
      <label>Nom du produit</label>
      
      <input
    type="text"
    formControlName="nom"
    aria-label="Nom du produit"
    placeholder="Nom du produit">
    <small class="error" *ngIf="produitForm.get('nom')?.invalid && produitForm.get('nom')?.touched">
        Le nom du produit est obligatoire.
    </small>
    </div>

    <div class="field">
      <label>Catégorie</label>
      <input
        type="text"
        formControlName="categorie"
        list="categories-disponibles"
        aria-label="Catégorie du produit"
        placeholder="Saisir ou créer une catégorie">
      <datalist id="categories-disponibles">
        <option *ngFor="let categorie of categories" [value]="categorie.nom"></option>
      </datalist>
      <small class="error" *ngIf="produitForm.get('categorie')?.invalid && produitForm.get('categorie')?.touched">
        La catégorie est obligatoire.
      </small>
    </div>

    <div class="field">
      <label>Prix (FCFA)</label>
      <input
    type="number"
    formControlName="prix"
    aria-label="Prix du produit"
    placeholder="Prix">
    </div>

    <div class="field">
      <label>Stock</label>
      <input
    type="number"
    formControlName="stock"
    aria-label="Stock du produit"
    placeholder="Stock">
    </div>

  </div>

  <div class="field">
    <label>Description</label>
    <textarea
rows="6"
formControlName="description"
aria-label="Description du produit"
placeholder="Description du produit">
</textarea>
  </div>
  <div class="field">
    <label>Statut</label>
    <select formControlName="est_actif" aria-label="Statut du produit">
      <option value="true">Actif</option>
      <option value="false">Inactif</option>
    </select>
</div>

  <div class="field">
    <label>Images</label>
    <input
    type="file"
    multiple
    aria-label="Images du produit"
    (change)="onFilesSelected($event)">
  </div>
 <div
    class="preview-container"
    *ngIf="imagePreviews.length">

    <div
        class="preview"
        *ngFor="let image of imagePreviews; let i = index">

        <img
            [src]="image"
          [alt]="'Aperçu image ' + (i + 1)"
          title="Aperçu de l'image du produit">

        <span
            class="main-badge"
            *ngIf="i === mainImageIndex">

            ⭐ Principale

        </span>

        <div class="preview-actions">

            <button
                type="button"
                class="primary-btn"
                (click)="setMainImage(i)">

                Définir

            </button>

            <button
                type="button"
                class="delete-image"
                (click)="supprimerImage(i)">

                ✕

            </button>

        </div>

    </div>

</div>

  <div class="actions">
    <small class="error" *ngIf="messageErreur" role="alert">{{ messageErreur }}</small>
    <button type="button" class="cancel" (click)="fermer.emit()">Annuler</button>
    <button
type="submit"
class="save">
    [disabled]="enregistrementEnCours">

{{ enregistrementEnCours ? 'Enregistrement...' : 'Enregistrer' }}

</button>
  </div>

</form>
  </div>
</div>
