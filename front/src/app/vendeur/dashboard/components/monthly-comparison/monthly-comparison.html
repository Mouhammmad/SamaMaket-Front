<div class="chart-container">
  <div class="chart-header">
    <h3>Comparaison Mensuelle</h3>
  </div>
  <div class="chart-wrapper">
    <canvas #chartCanvas width="800" height="320"></canvas>
  </div>
  <div *ngIf="!ventes || ventes.length === 0" class="no-data">
    Aucune donnée de ventes disponible
  </div>
</div>
