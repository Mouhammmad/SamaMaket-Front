<div class="panel">

  <div class="panel-header">
    <h3>Évolution des ventes</h3>
  </div>

  <div *ngIf="ventes?.length; else noSales" class="chart-wrapper">
    <canvas #chartCanvas></canvas>
  </div>

  <ng-template #noSales>
    <div class="empty">Aucune donnée de ventes disponible.</div>
  </ng-template>

</div>
