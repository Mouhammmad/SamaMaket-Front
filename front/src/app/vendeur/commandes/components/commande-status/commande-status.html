<div
class="overlay"
*ngIf="commande"
(click)="fermer.emit()">

<div class="modal" (click)="$event.stopPropagation()">

<h2>

Modifier le statut

</h2>

<select [(ngModel)]="statut" aria-label="Statut de la commande">

<option value="en_attente">🟡 En attente</option>

<option value="confirme">🔵 Confirmée</option>

<option value="expedie">🚚 Expédiée</option>

<option value="livre">✅ Livrée</option>

<option value="annule">❌ Annulée</option>

</select>

<div class="buttons">

<button
type="button"
class="cancel"
(click)="fermer.emit()">

Annuler

</button>

<button
type="button"
(click)="sauvegarder()">

Enregistrer

</button>

</div>

</div>

</div>
