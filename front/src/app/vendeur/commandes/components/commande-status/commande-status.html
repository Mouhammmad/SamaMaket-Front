<div
class="overlay"
*ngIf="commande && showModal"
(click)="fermerModal()">

<div class="modal" (click)="$event.stopPropagation()">

<h2>Modifier le statut{{ commande ? ' - #' + commande.numero : '' }}</h2>

<div class="form-group">
  <label for="statusSelect">Sélectionnez le nouveau statut:</label>
  <select 
    id="statusSelect"
    [value]="statut" 
    (change)="onStatutChange($event)" 
    aria-label="Statut de la commande">
    <option value="">-- Sélectionner --</option>
    <option value="en_attente">🟡 En attente</option>
    <option value="confirme">🔵 Confirmée</option>
    <option value="expedie">🚚 Expédiée</option>
    <option value="livre">✅ Livrée</option>
    <option value="annule">❌ Annulée</option>
  </select>
</div>

<div class="buttons">

<button
type="button"
class="cancel"
(click)="fermerModal()">

Annuler

</button>

<button
type="button"
class="save"
[disabled]="!statut"
(click)="sauvegarder()">

Enregistrer

</button>

</div>

</div>

</div>
