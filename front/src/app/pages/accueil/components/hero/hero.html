<section class="hero">

  <div class="container">

    <span class="hero-badge">
      Marketplace local – Sénégal & Afrique de l'Ouest
    </span>

    <h1>
      Achetez et soutenez
      <span>vos commerçants</span>
    </h1>

    <p>
      Des milliers de produits locaux authentiques : artisanat, mode,
      alimentation et bien plus encore, livrés directement chez vous.
    </p>

    <div class="hero-search">

      <input
        type="text"
        placeholder="Rechercher un produit..."
        [(ngModel)]="query"
        (keyup.enter)="rechercher()">

      <select aria-label="Sélectionner une catégorie">
        <option value="">Toutes les catégories</option>
        <option value="mode">Mode</option>
        <option value="electronique">Électronique</option>
        <option value="maison">Maison</option>
        <option value="alimentation">Alimentation</option>
      </select>

      <button type="button" (click)="rechercher()">
        Rechercher
      </button>

    </div>

    <div class="hero-actions">
      <a routerLink="/produits" class="btn-primary">Découvrir les produits</a>
      <a routerLink="/register" class="btn-secondary">Créer un compte</a>
    </div>

  </div>

</section>
