<section class="offres-page">
  <div class="container">
    <app-offres-header></app-offres-header>

    <app-offres-filtres
      (recherche)="rechercherOffres($event)"
      (typeRemise)="filtrerTypeRemise($event)"
      (boutique)="rechercherBoutique($event)"
      (reset)="reinitialiserFiltres()">
    </app-offres-filtres>

    <div *ngIf="chargement" class="loading-state">
      Chargement des offres...
    </div>

    <div *ngIf="!chargement && erreur" class="empty-state">
      <p>Impossible de charger les offres pour le moment.</p>
    </div>

    <app-offres-vides *ngIf="aucuneOffre && !erreur"></app-offres-vides>

    <div class="cards-grid" *ngIf="!chargement && !erreur && offresFiltrees.length > 0">
      <app-offres-card
        *ngFor="let offre of offresFiltrees"
        [offre]="offre"
        (produitClick)="voirProduit($event)">
      </app-offres-card>
    </div>
  </div>
</section>
