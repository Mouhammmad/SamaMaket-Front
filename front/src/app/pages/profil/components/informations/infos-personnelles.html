<div class="card">

    <div class="card-header">

        <h2>Informations personnelles</h2>

        <button class="btn-save">
            <i class="bi bi-save"></i>
            Enregistrer
        </button>

    </div>

    <form>

        <div class="grid">

            <div class="form-group">
                <label for="profil-prenom">Prénom</label>
                <input id="profil-prenom" type="text" value="Moussa" placeholder="Votre prénom">
            </div>

            <div class="form-group">
                <label for="profil-nom">Nom</label>
                <input id="profil-nom" type="text" value="Sow" placeholder="Votre nom">
            </div>

            <div class="form-group">
                <label for="profil-email">Adresse email</label>
                <input id="profil-email" type="email" value="moussa@email.com" placeholder="Votre adresse email">
            </div>

            <div class="form-group">
                <label for="profil-telephone">Téléphone</label>
                <input id="profil-telephone" type="text" value="+221 77 123 45 67" placeholder="Votre téléphone">
            </div>

        </div>

        <div class="form-group full">

            <label for="profil-ville">Ville / Localisation</label>

            <input
                id="profil-ville"
                type="text"
                value="Dakar, Sénégal"
                placeholder="Ville ou localisation">

        </div>

    </form>

</div>
