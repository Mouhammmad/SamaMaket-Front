<div class="commandes-page">

    <div class="page-header">

        <div>

            <h2>Mes commandes</h2>

            <p>Retrouvez l'historique de toutes vos commandes.</p>

        </div>

        <button class="btn-download">

            <i class="bi bi-download"></i>

            Télécharger l'historique

        </button>

    </div>

    <!-- Statistiques -->

    <div class="stats">

        <div class="card-stat">

            <h3>12</h3>

            <span>Total</span>

        </div>

        <div class="card-stat">

            <h3>2</h3>

            <span>En cours</span>

        </div>

        <div class="card-stat">

            <h3>8</h3>

            <span>Livrées</span>

        </div>

        <div class="card-stat">

            <h3>2</h3>

            <span>Annulées</span>

        </div>

    </div>

    <!-- Recherche -->

    <div class="toolbar">

        <input
            type="text"
            placeholder="Rechercher une commande..."
            aria-label="Recherche commande">

        <label for="statut-commande" class="visually-hidden">Filtrer par statut</label>
        <select id="statut-commande" aria-label="Filtrer les statuts" title="Filtrer les statuts">

            <option>Tous les statuts</option>

            <option>En cours</option>

            <option>Livrée</option>

            <option>Annulée</option>

        </select>

    </div>

    <!-- Les cartes de commandes -->

    <div class="orders">

        <!-- Les cartes viendront ici -->

    </div>

</div>
