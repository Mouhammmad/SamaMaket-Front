<header class="auth-header">
  <div class="logo">
    <img src="assets/images/logo.png" alt="Sama Market">
  </div>

  <a routerLink="/" class="back-home">
    ← Retour à l'accueil
  </a>
</header>

<div class="auth-intro">
  <h1>Connexion admin</h1>
  <p>Accédez à l'administration de la marketplace.</p>
</div>

<div class="auth-form">
  <div *ngIf="erreur" class="error-message">{{ erreur }}</div>

  <form (ngSubmit)="onSubmit()" novalidate>
    <div class="form-group">
      <label for="username">Nom d’utilisateur ou email</label>
      <input id="username" type="text" [(ngModel)]="username" name="username" required />
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" [(ngModel)]="password" name="password" required />
    </div>

    <button class="btn-submit" type="submit" [disabled]="chargement">
      {{ chargement ? 'Connexion en cours...' : 'Se connecter' }}
    </button>
  </form>
</div>
