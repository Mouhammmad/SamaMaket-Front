<div class="card">

    <div class="image-container">

        <div class="badge promo" *ngIf="produit.promotion_active">
            En promo -{{ produit.promotion_active.valeur }}%
        </div>
        <span
            class="badge new"
            *ngIf="produit.est_nouveau">

            Nouveau

        </span>

<button
class="favorite"
(click)="toggleFavori(produit)"
[class.active]="produit.est_favori"
title="Favori"
[attr.aria-label]="produit.est_favori ? 'Retirer des favoris' : 'Ajouter aux favoris'">

<i
class="fa-solid"

[ngClass]="

produit.est_favori

?

'fa-heart'

:

'fa-heart-o'

">

</i>

</button>

        <img

    [src]="produit.image_url"

    [alt]="produit.nom"

    title="{{ produit.nom }}">
    </div>

    <div class="body">

        <div class="rating">
            <span class="stars" aria-label="Note du produit">
                <span *ngFor="let pleine of getEtoiles()" [class.empty-star]="!pleine">
                    ★
                </span>
            </span>
            <strong>{{ getNote() | number:'1.1-1' }}</strong>
            <span>({{ getNombreAvis() }} avis)</span>

        </div>

        <h3>

            {{ produit.nom }}

        </h3>

        <p class="vendeur">

            {{ produit.boutique }}

        </p>

        <div class="prix">

{{ produit.prix_promo || produit.prix }}

FCFA

</div>
        <div class="actions">

            <button
                type="button"
                class="voir"
                (click)="voirProduit()">

                Voir

            </button>

            <button
(click)="ajouterPanier()">

Ajouter au panier

</button>

        </div>

    </div>

</div>
