<h2>

Utilisateurs

</h2>

<input

class="form-control"

[(ngModel)]="recherche"

(input)="charger()"

placeholder="Rechercher...">

<table class="table mt-4">

<thead>

<tr>

<th>Nom</th>

<th>Email</th>

<th>Rôle</th>

<th>Date</th>

<th></th>

</tr>

</thead>

<tbody>

<tr

*ngFor="let u of utilisateurs">

<td>

{{u.username}}

</td>

<td>

{{u.email}}

</td>

<td>

{{u.role}}

</td>

<td>

{{u.date_joined | date}}

</td>

<td>

<button

class="btn btn-primary"

[routerLink]="['/admin/utilisateurs',u.id]">

Voir

</button>

</td>

</tr>

</tbody>

</table>
