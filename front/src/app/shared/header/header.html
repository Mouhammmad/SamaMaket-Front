<header class="header">

  <div class="container">

    <nav class="navbar">

      <!-- Logo -->
      <a routerLink="/" class="logo">
        <span class="green">SAMA</span>
        <span class="orange">MARKET</span>
      </a>

      <!-- Menu -->
      <div class="menu">

        <a routerLink="/">Home</a>

        <a routerLink="/produits">Produits</a>

        <a routerLink="/vendeurs">Vendeurs</a>

        <a routerLink="/offres">Offres</a>
      </div>

      <!-- Actions -->
      <div class="actions">

        <a routerLink="/panier" class="btn btn-outline-dark position-relative">

  🛒 Panier

  <span *ngIf="nombreArticles > 0"
      class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">

      {{ nombreArticles }}

    </span>

</a>
        

        <button
          class="login-btn"
          [routerLink]="estConnecte ? '/client' : '/login'">
          {{ estConnecte ? 'Mon compte' : 'Connexion' }}
        </button>

      </div>

    </nav>

  </div>

</header>
