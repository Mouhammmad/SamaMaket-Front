<div class="product-card">

    <!-- IMAGE -->

    <div class="image">

        <img
            [src]="produit.image_url || produit.image || 'assets/images/placeholder-product.jpg'"
            [alt]="produit.nom"
            [title]="produit.nom"
            title="{{ produit.nom }}">

        @if (produit.estPromo) {

            <span class="badge promo">

                Promo

            </span>

        } @else {

            <span class="badge nouveau">

                Nouveau

            </span>

        }

        <button
            class="favorite"
            type="button">

            ❤

        </button>

    </div>

    <!-- CONTENU -->

    <div class="content">

        <small>

            {{ produit.categorie || 'Catégorie' }}

        </small>

        <h3>

            {{ produit.nom }}

        </h3>

        <div class="rating">

            ⭐⭐⭐⭐⭐

            <span>

                ({{ produit.nombreAvis || 0 }})

            </span>

        </div>

        <p class="shop">

            {{ produit.boutique || 'Boutique' }}

        </p>

        <div class="price">

            {{ produit.prix | number }} FCFA

        </div>

        <div class="buttons">

            <a

                [routerLink]="['/produit', produit.id]"

                class="btn-view">

                Voir

            </a>

            <button

                class="btn-cart"

                type="button">

                🛒

            </button>

        </div>

    </div>

</div>
