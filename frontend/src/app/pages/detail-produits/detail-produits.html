@if (produit) {

<div class="container mt-5">

  <div class="row">

    <div class="col-md-6">

      <img
        [src]="produit.image_url"
        [alt]="produit.nom"
        class="img-fluid rounded shadow">

    </div>

    <div class="col-md-6">

      <h2>{{ produit.nom }}</h2>

      <p class="text-muted">
        {{ produit.categorie }}
      </p>

      <h3 class="text-success">
        {{ produit.prix }} FCFA
      </h3>

      <p>
        {{ produit.description }}
      </p>

      <p>
        <strong>Boutique :</strong>
        {{ produit.boutique }}
      </p>

      <button class="btn btn-success">
        Ajouter au panier
      </button>

    </div>

  </div>

</div>

} @else {

<p>Chargement...</p>

}
