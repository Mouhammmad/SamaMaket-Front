<div class="container mt-4">

  <h2 class="mb-4">
    Nos produits
  </h2>
  <p>Nombre de produits : {{ produits.length }}</p>

  <div class="row">

    <div class="col-md-4 mb-4" *ngFor="let produit of produits">

      <div class="card h-100 shadow-sm">

          <img
            [src]="produit.image_url"
            [alt]="produit.nom"
            class="card-img-top"
            style="height:220px; object-fit:cover;">

          <div class="card-body">

            <h5>{{ produit.nom }}</h5>

            <p class="text-muted">
              {{ produit.categorie }}
            </p>

            <p>
              Boutique :
              {{ produit.boutique }}
            </p>

            <h4 class="text-success">
              {{ produit.prix }} FCFA
            </h4>

            <a
              class="btn btn-success w-100"
              [routerLink]="['/produit', produit.id]">

              Voir le produit

            </a>

          </div>

        </div>

      </div>

  </div>

</div>
